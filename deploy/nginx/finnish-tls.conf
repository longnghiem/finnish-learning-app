# /etc/nginx/conf.d/finnish.conf  (after install-tls.sh — note the DESTINATION
# filename is finnish.conf, not finnish-tls.conf; there must never be two files
# both claiming default_server)
#
# Phase 2 of the two-phase nginx install. Installed by deploy/nginx/install-tls.sh,
# NOT by install-nginx.sh. This file REQUIRES a Let's Encrypt certificate to
# already exist at /etc/letsencrypt/live/opisuomea.org/ — nginx -t fails hard if
# the ssl_certificate path does not resolve, which is precisely why the bootstrap
# vhost (finnish.conf) is a separate, HTTP-only file.
#
# Two server blocks:
#   A. :80  — serves the ACME challenge, redirects everything else to HTTPS.
#   B. :443 — the real site. Body is identical to finnish.conf's server block.
#
# TLS parameters are inline rather than `include`-d from
# /etc/letsencrypt/options-ssl-nginx.conf. That file is dropped by the
# python3-certbot-nginx INSTALLER plugin, which we never run (we use
# `certbot certonly --webroot`), so it is not guaranteed to exist. Inlining keeps
# this file self-contained and makes nginx -t deterministic.
#
# No HSTS here on purpose. HSTS turns an accidental downgrade to HTTP into a site
# browsers refuse outright, with no click-through. Header hardening is a separate,
# later action point — to be done only once the clobber risk this file removes is actually gone.
#
# The EC2 Security Group opens 22 (SSH), 80, and 443. Port 80 must STAY open:
# Let's Encrypt renews over HTTP-01 every ~60 days, and it serves the redirect.
#
# default_server: We commented out the stock default server in
# /etc/nginx/nginx.conf, so we can safely claim default_server here without a
# "duplicate default server" emerg. Claiming it means these blocks also answer
# requests that arrive by bare IP or an unknown Host: header.

# ══════════════════════════════════════════════════════════════════════════════
# A. Port 80 — ACME challenge + permanent redirect to HTTPS.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name opisuomea.org www.opisuomea.org;

    # ──────────────────────────────────────────────────────────────────────
    # ACME first, redirect second. Order is load-bearing: if the catch-all
    # redirect matched the challenge path, every renewal would be answered with
    # a 301 to :443. Let's Encrypt does follow redirects, but relying on that
    # makes renewal depend on the TLS stack being healthy — which is the one
    # thing you cannot assume when the certificate is about to expire.
    # ──────────────────────────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# B. Port 443 — the actual site.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name opisuomea.org www.opisuomea.org;

    # ──────────────────────────────────────────────────────────────────────
    # Certificate paths.
    #
    # `opisuomea.org` here is the Let's Encrypt LINEAGE name, which certbot
    # derives from the FIRST -d flag it was given. install-tls.sh asserts that
    # its own $DOMAINS starts with the same host before installing this file, so
    # a mismatch fails loudly at install time instead of as a silent 404 on :443.
    #
    # fullchain.pem = leaf + intermediates (what nginx must serve).
    # privkey.pem   = the private key, root-only (0600) — nginx reads it as root
    #                 before dropping to the nginx user for workers.
    # ──────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/opisuomea.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opisuomea.org/privkey.pem;

    # ──────────────────────────────────────────────────────────────────────
    # TLS parameters — Mozilla "intermediate" profile, ECDHE-only.
    #
    # The DHE ciphersuites from the stock Mozilla list are omitted deliberately:
    # they require ssl_dhparam, whose file is another certbot-installer artefact
    # we do not generate. Every client from IE11/Win7 forward supports ECDHE, so
    # dropping DHE costs nothing here.
    #
    # ssl_session_tickets off: tickets weaken forward secrecy unless the ticket
    # key is rotated, and nginx has no built-in rotation.
    #
    # ssl_prefer_server_ciphers off is the modern recommendation — with TLS 1.3
    # and an AEAD-only cipher list, letting the client choose favours whatever is
    # hardware-accelerated on its end.
    # ──────────────────────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Static SPA served from the directory rsync'd by deploy/deploy.sh.
    # The owning user is `nginx` (AL2023's nginx user — not `www-data`); TASK_08
    # uses rsync --chown=nginx:nginx to set ownership on upload.
    root /var/www/finnish/dist;
    index index.html;

    # Reasonable upload size for image attachments (LocalImageStorageService
    # accepts multipart/form-data). Default 1m would 413 on the first PNG.
    client_max_body_size 10m;

    # ──────────────────────────────────────────────────────────────────────
    # 1. Long-cache hashed assets.
    #
    # Vite emits files like assets/index-Q3pP_abc.js with content-hashed names.
    # Safe to cache forever because the filename changes whenever the content
    # changes. immutable tells the browser not to revalidate even on reload.
    # ──────────────────────────────────────────────────────────────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ──────────────────────────────────────────────────────────────────────
    # 2. Backend API — reverse-proxy to Spring Boot.
    #
    # proxy_pass without a trailing slash, combined with `location /api/`,
    # passes the FULL URI (including `/api/`) to the backend. The backend's
    # controllers are mapped under /api/* (see backend/.../controller/), so the
    # path lines up perfectly.
    #
    # X-Forwarded-Proto now actually carries "https" — this is the vhost where
    # that header stops being decorative.
    # ──────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 60s is plenty for a demo backend. Spring's default request timeout is
        # higher, so this is the binding ceiling. Bump if you ever add a slow
        # endpoint (long-running quiz analytics, etc.).
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ──────────────────────────────────────────────────────────────────────
    # 3. Image bytes served by the backend (LocalImageStorageService).
    #
    # Could be served directly by nginx from IMAGE_STORAGE_LOCATION
    # (/var/lib/finnish/uploads) — but that would require nginx read access to
    # that path, plus SELinux relabelling. Proxying through the backend keeps
    # the authorisation surface in one place (Spring Security) and one less
    # SELinux rule to maintain. Performance cost is negligible for a demo.
    # ──────────────────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────────────────────────────────
    # 4. ACME HTTP-01 challenge.
    #
    # Present on :443 as well as :80 because Let's Encrypt follows the redirect
    # from block A when a renewal is validated against the apex over HTTP. The
    # second hop lands here, so the token has to be reachable from both.
    # ──────────────────────────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ──────────────────────────────────────────────────────────────────────
    # 5. SPA fallback.
    #
    # try_files first tries to serve $uri as a literal file (e.g. /favicon.ico,
    # /robots.txt). If nothing matches, it returns /index.html so React Router
    # can resolve the route client-side. Without this block, deep links like
    # https://<host>/dashboard would 404.
    #
    # Caching: leave at nginx default (no Cache-Control). index.html is tiny
    # and updates with every deploy — caching it would mask deploys.
    # ──────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    # Basic access/error logging. Default file paths on AL2023.
    access_log /var/log/nginx/finnish.access.log;
    error_log  /var/log/nginx/finnish.error.log warn;
}