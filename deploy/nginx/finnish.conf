# /etc/nginx/conf.d/finnish.conf  (after install-nginx.sh)
#
# Single-server nginx site for the Finnish Learning demo. Three jobs:
#   1. Serve the React SPA from /var/www/finnish/dist (built by deploy/build.sh,
#      uploaded by deploy/deploy.sh).
#   2. Reverse-proxy /api/ and /uploads/ to the Spring Boot backend on
#      127.0.0.1:8080.
#   3. Fall back to index.html for any unmatched path so React Router can handle
#      client-side routes (e.g. /dashboard, /topics/3, /quiz/3).
#
# This is phase 1 of a two-phase install; it is HTTP-only by design because no certificate exists
# yet at this point in a fresh bootstrap; `install-tls.sh` replaces the installed file with
# `finnish-tls.conf` in phase 2.
#
# The EC2 Security Group opens 22 (SSH), 80, and 443. Kafka and the JVM listen
# on 127.0.0.1 and are not reachable from the internet.
#
# default_server: We commented out the stock default server in
# /etc/nginx/nginx.conf, so we can safely claim default_server here without a
# "duplicate default server" emerg. Claiming it means this block also answers
# requests that arrive by bare IP or an unknown Host: header.

# ══════════════════════════════════════════════════════════════════════════════
# Rate limit for the recruiter chatbot (/api/ask/), used by location 2a below.
#
# limit_req_zone is only allowed at the http level. This file is included inside
# nginx.conf's http {} block (conf.d/*.conf), so a line outside the server
# blocks is at the http level. finnish.conf and finnish-tls.conf are installed
# under the same name, never both, so the zone is defined once.
#
# $binary_remote_addr is the address of whoever opened the TCP connection to
# nginx: the visitor, because DNS points straight at this instance (no CDN or
# proxy in front). If a proxy is ever put in front (e.g. Cloudflare's orange
# cloud), every visitor would arrive with the proxy's address and share one
# limit: set up the realip module for that proxy first.
#
# 1m of shared memory holds about 16,000 addresses, far more than this site
# sees in a minute.
# ══════════════════════════════════════════════════════════════════════════════
limit_req_zone $binary_remote_addr zone=ask:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name opisuomea.org www.opisuomea.org;

    # Static SPA served from the directory rsync'd by deploy/deploy.sh.
    # The owning user is `nginx` (AL2023's nginx user — not `www-data`); deploy.sh
    # uses rsync --chown=nginx:nginx to set ownership on upload.
    root /var/www/finnish/dist;
    index index.html;

    # Reasonable upload size for image attachments (LocalImageStorageService
    # accepts multipart/form-data). Default 1m would 413 on the first PNG.
    client_max_body_size 10m;

    # ──────────────────────────────────────────────────────────────────────
    # 1. Long-cache hashed assets.
    #
    # Vite emits files like assets/index-Q3pP_abc.js with content-hashed names.
    # Safe to cache forever because the filename changes whenever the content
    # changes. immutable tells the browser not to revalidate even on reload.
    # ──────────────────────────────────────────────────────────────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ──────────────────────────────────────────────────────────────────────
    # 2. Backend API — reverse-proxy to Spring Boot.
    #
    # proxy_pass without a trailing slash, combined with `location /api/`,
    # passes the FULL URI (including `/api/`) to the backend. The backend's
    # controllers are mapped under /api/* (see backend/.../controller/), so the
    # path lines up perfectly.
    #
    # The X-Forwarded-* headers preserve the original client IP/scheme/host for
    # the backend's logs. The backend doesn't currently read them, but the cost
    # of setting them is zero and removes a footgun for any future TLS work.
    # ──────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 60s is plenty for a demo backend. Spring's default request timeout is
        # higher, so this is the binding ceiling. Bump if you ever add a slow
        # endpoint (long-running quiz analytics, etc.).
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

# ──────────────────────────────────────────────────────────────────────
    # 2a. Recruiter chatbot API (/api/ask/): rate-limited, then proxied.
    #
    # nginx picks the LONGEST matching prefix, so /api/ask/... lands here and
    # not in block 2, wherever the blocks are in the file. The admin's
    # /api/admin/ask/... doesn't start with /api/ask/, so it isn't limited.
    #
    # This is the first layer only. The backend also limits each IP per day
    # (in Postgres) and has a global spending cap. This layer stops a flood
    # before it reaches the JVM, which runs on 384 MB.
    #
    # rate=10r/m, burst=5 nodelay: an address may send 6 requests at once,
    # then one more every 6 seconds. Opening the page costs 2 (stats and the
    # chat session); each chat message or fit check is 1. A person never gets
    # near it: every answer takes several seconds to read. A script does.
    #
    # Over the limit: 429 with a JSON body in the backend's error format and
    # the code BUSY, so the page shows "The assistant is busy right now.
    # Please try again in a moment." With nginx's default HTML error page the
    # page could only say "Something went wrong". The error_page here catches
    # only nginx's own 429: the backend's 429s (e.g. RATE_LIMITED, the daily
    # limit) pass through unchanged, because proxy_intercept_errors is off.
    # Each refused request is logged to the error log at warn level.
    #
    # X-Real-IP is the header the backend's ClientIpResolver reads (only on
    # requests from loopback, i.e. from this nginx). proxy_set_header replaces
    # whatever the client sent. X-Forwarded-For is replaced as well, with
    # $remote_addr instead of block 2's $proxy_add_x_forwarded_for (which
    # appends to the client's value): the backend doesn't read it, and nothing
    # a client wrote should travel further.
    #
    # Streaming: the answers are Server-Sent Events. The backend sends
    # `X-Accel-Buffering: no`, which turns nginx's response buffering off for
    # those responses, so no setting is needed here. proxy_read_timeout is the
    # longest SILENCE between two reads, not the length of the answer: a chat
    # stream ends within 55 s, and a fit check sends a keepalive every 15 s.
    # ──────────────────────────────────────────────────────────────────────
    location /api/ask/ {
        limit_req           zone=ask burst=5 nodelay;
        limit_req_status    429;
        limit_req_log_level warn;
        error_page          429 = @ask_rate_limited;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # The answer to a request over the /api/ask/ limit (see 2a).
    location @ask_rate_limited {
        default_type application/json;
        return 429 '{"code":"BUSY","message":"Too many requests. Please wait a minute and try again."}';
    }

    # ──────────────────────────────────────────────────────────────────────
    # 3. Image bytes served by the backend (LocalImageStorageService).
    #
    # Could be served directly by nginx from IMAGE_STORAGE_LOCATION
    # (/var/lib/finnish/uploads) — but that would require nginx read access to
    # that path, plus SELinux relabelling. Proxying through the backend keeps
    # the authorisation surface in one place (Spring Security) and one less
    # SELinux rule to maintain. Performance cost is negligible for a demo.
    # ──────────────────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────────────────────────────────
    # 4. ACME HTTP-01 Challenge (Let's Encrypt SSL Verification)
    #
    # When requesting or renewing an SSL certificate, Certbot places a temporary
    # "token" file in this directory. Let's Encrypt then fetches it over plain
    # HTTP (port 80) to verify we actually control this domain.
    #
    # KEY DESIGN DECISIONS:
    # • Separate from React App: We use `/var/www/letsencrypt` instead of the
    #   React build folder (`/var/www/finnish/dist`). Our deploy script wipes
    #   the React folder clean on every update, which would accidentally delete
    #   renewal tokens and break auto-renewals. (The `install-tls.sh` script
    #   safely creates this directory and applies the required SELinux labels).
    #
    # • Required in Both Config Phases: This block must exist in this initial
    #   HTTP-only config, AND in the future HTTPS config (`finnish-tls.conf`).
    #   In the HTTPS config, it must sit *before* any HTTP-to-HTTPS redirects
    #   so that 60-day auto-renewals aren't blocked by a redirect to port 443.
    #
    # • Strict 404 on Failure: We use `try_files $uri =404;` instead of falling
    #   back to `/index.html`. If the token is missing, Let's Encrypt must get
    #   a clear "404 Not Found" error, not an HTML page. This ensures Certbot
    #   fails loudly and predictably, making debugging easier.
    # ──────────────────────────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ──────────────────────────────────────────────────────────────────────
    # 5. SPA fallback.
    #
    # try_files first tries to serve $uri as a literal file (e.g. /favicon.ico,
    # /robots.txt). If nothing matches, it returns /index.html so React Router
    # can resolve the route client-side. Without this block, deep links like
    # http://<host>/dashboard would 404.
    #
    # Caching: leave at nginx default (no Cache-Control). index.html is tiny
    # and updates with every deploy — caching it would mask deploys.
    # ──────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    # Basic access/error logging. Default file paths on AL2023.
    access_log /var/log/nginx/finnish.access.log;
    error_log  /var/log/nginx/finnish.error.log warn;
}