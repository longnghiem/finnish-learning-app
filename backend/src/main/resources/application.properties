spring.application.name=finnish-learning-backend

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5532/finnish_learning_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JOOQ
spring.jooq.sql-dialect=POSTGRES

# Multipart (image uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Image storage
app.storage.location=${IMAGE_STORAGE_LOCATION:./uploads}

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
app.jwt.secret=${JWT_SECRET:default-dev-secret-that-is-at-least-256-bits-long-for-hs256!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=finnish-learning-app

# CORS — comma-separated list of allowed origins. Empty means no cross-origin
# config is registered (same-origin only, used when the app sits behind a
# reverse proxy that serves the SPA and /api/* from the same host).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging — directory for rolling log files. On EC2 the deploy env file sets
# LOG_DIR=/opt/finnish/logs; local dev falls back to ./logs (gitignored).
# Consumed by logback-spring.xml via <springProperty>.
app.logging.dir=${LOG_DIR:./logs}

# Groq sentence-evaluation client
app.groq.api-key=${GROQ_API_KEY:}
app.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.groq.daily-quota=${GROQ_DAILY_QUOTA:50}

# Bedrock essay-evaluation client. No API key here by design: production authenticates
# through the EC2 instance profile via the AWS default credential chain, and local dev
# through ~/.aws/credentials — neither passes through Spring config.
app.bedrock.region=${AWS_REGION:eu-north-1}
app.bedrock.model-id=${BEDROCK_MODEL_ID:eu.anthropic.claude-haiku-4-5-20251001-v1:0}
app.bedrock.daily-quota=${BEDROCK_DAILY_QUOTA:20}
app.bedrock.connect-timeout-ms=${BEDROCK_CONNECT_TIMEOUT_MS:5000}
app.bedrock.read-timeout-ms=${BEDROCK_READ_TIMEOUT_MS:120000}
app.bedrock.max-tokens=${BEDROCK_MAX_TOKENS:2000}

# Recruiter chatbot ("Ask"). See docs/adr/0002-recruiter-chatbot-mcp-architecture.md
app.ask.ip-hash-key=${ASK_IP_HASH_KEY:}
app.ask.limits.chat-per-ip-per-day=${ASK_CHAT_PER_IP_PER_DAY:30}
app.ask.limits.fit-checks-per-ip-per-day=${ASK_FIT_CHECKS_PER_IP_PER_DAY:3}
app.ask.limits.sessions-per-ip-per-hour=${ASK_SESSIONS_PER_IP_PER_HOUR:5}

# Cloudflare Turnstile, the bot check before a chat session is created. Without a secret key the
# app still starts, but the chatbot can't create sessions.
app.ask.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.ask.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
app.ask.turnstile.connect-timeout-ms=3000
app.ask.turnstile.read-timeout-ms=5000
app.ask.session.ttl-minutes=${ASK_SESSION_TTL_MINUTES:60}
app.ask.session.max-messages=${ASK_SESSION_MAX_MESSAGES:10}
app.ask.session.max-message-chars=500

# Input guardrail (Bedrock InvokeGuardrailChecks). A score at or above a threshold blocks the
# input; scores go from 0.0 to 1.0 in steps of 0.2. Job descriptions get a higher prompt-attack
# threshold because they are full of instructions.
app.ask.guardrail.content-threshold=${ASK_GUARDRAIL_CONTENT_THRESHOLD:0.6}
app.ask.guardrail.chat-prompt-attack-threshold=${ASK_GUARDRAIL_CHAT_PROMPT_ATTACK_THRESHOLD:0.6}
app.ask.guardrail.fit-prompt-attack-threshold=${ASK_GUARDRAIL_FIT_PROMPT_ATTACK_THRESHOLD:0.8}
app.ask.guardrail.timeout-ms=10000

# Limits of the tool loop that answers one request. A round is one model call that asks for tools.
# A fit check's research calls get a short output limit; only its report call gets the long one.
app.ask.agent.max-reads-per-round=4
app.ask.agent.chat-max-tokens=400
app.ask.agent.chat-max-tool-rounds=3
app.ask.agent.fit-step-max-tokens=300
app.ask.agent.fit-report-max-tokens=1500
app.ask.agent.fit-max-tool-rounds=6

# Spending caps in USD: one pool for chat and fit checks, per Europe/Helsinki day and month. The
# monthly cap is the hard ceiling; the daily cap stops one busy day from using up the month.
app.ask.budget.monthly-usd=${ASK_BUDGET_MONTHLY_USD:5.00}
app.ask.budget.daily-usd=${ASK_BUDGET_DAILY_USD:0.25}
# Input tokens allowed for each tool result in the worst-case estimate made before a request
app.ask.budget.tool-result-tokens=1000

# Claude Haiku 4.5 through the eu. inference profile, in USD per million tokens (AWS Pricing API,
# "Regional" rows, eu-north-1, checked 2026-10-17). If ASK_MODEL_ID changes, change these too, and
# compare them with the AWS bill (Cost Explorer) after the first days of use.
app.ask.price.input-per-million-tokens=${ASK_PRICE_INPUT:1.10}
app.ask.price.output-per-million-tokens=${ASK_PRICE_OUTPUT:5.50}
app.ask.price.cache-read-per-million-tokens=${ASK_PRICE_CACHE_READ:0.11}
app.ask.price.cache-write-per-million-tokens=${ASK_PRICE_CACHE_WRITE:1.375}
# Bedrock Guardrails, in USD per 1,000 text units (one unit = up to 1,000 characters, per check)
app.ask.price.guardrail-content-per-k-units=0.07
app.ask.price.guardrail-prompt-attack-per-k-units=0.08

# The profile MCP server (a Lambda function URL with AWS_IAM auth). ASK_MCP_URL is the function URL
# with "mcp" appended. For local development, run `npm run dev` in mcp-server/ and set
# ASK_MCP_SIGN=false: that server has no auth, and it listens on localhost only.
app.ask.mcp.url=${ASK_MCP_URL:http://localhost:3001/mcp}
app.ask.mcp.region=${AWS_REGION:eu-north-1}
app.ask.mcp.sign-requests=${ASK_MCP_SIGN:true}
app.ask.mcp.connect-timeout-ms=3000
# Includes a Lambda cold start (about 1 s)
app.ask.mcp.request-timeout-ms=10000

# The model that answers chat messages: Claude Haiku 4.5 through the eu. inference profile, the same
# model as the essay feature but a separate setting. If ASK_MODEL_ID changes, change app.ask.price.*
# too and check the new model's prompt-caching minimum.
app.ask.model.id=${ASK_MODEL_ID:eu.anthropic.claude-haiku-4-5-20251001-v1:0}
# A JSON object sent as Converse additionalModelRequestFields; blank sends none (right for Haiku 4.5).
# For a model that thinks by default, e.g. Haiku 5.5: {"thinking":{"type":"disabled"}}
app.ask.model.additional-request-fields=${ASK_ADDITIONAL_MODEL_FIELDS:}
# The most one model call may take, the SDK's own retries included
app.ask.model.timeout-ms=30000