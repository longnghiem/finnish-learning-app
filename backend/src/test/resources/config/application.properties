# Test-only settings, loaded IN ADDITION to src/main/resources/application.properties: Spring Boot
# reads both classpath:/application.properties and classpath:/config/application.properties, and
# the second one wins for the keys it sets.
#
# A fixed, public key for the IP hash, so every test context can start. Never use it anywhere else.
app.ask.ip-hash-key=test-only-ip-hash-key-not-a-secret-0123456789