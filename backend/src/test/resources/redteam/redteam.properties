# Settings of the red-team suite (./gradlew redTeam), on top of the normal test settings.
# The profile server of `npm run dev` in mcp-server/ runs locally without auth, so requests
# aren't signed.
app.ask.mcp.url=${ASK_MCP_URL:http://localhost:3001/mcp}
app.ask.mcp.sign-requests=false
# The suite's own spending cap, a hard stop if something loops. A run costs about $0.15.
app.ask.budget.daily-usd=1.00
app.ask.budget.monthly-usd=1.00